[project]
name = "aegisops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Firas Chabouh", email = "firas.chabouh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
aegisops = "aegisops:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
