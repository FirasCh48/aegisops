[project]
name = "aegisops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Firas Chabouh", email = "firas.chabouh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.13",
    "fastapi>=0.141.1",
    "fastembed>=0.9.0",
    "google-genai>=2.22.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.15.0",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
aegisops = "aegisops:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
